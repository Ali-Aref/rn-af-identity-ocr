plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.rnocrpro'
version = '0.1.0'

repositories {
  google()
  mavenCentral()
  maven { url 'https://jitpack.io' }
}

android {
  namespace "expo.modules.rnocrpro"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  sourceSets {
    main {
      assets.srcDirs += ['src/main/assets']
    }
  }
}

dependencies {
  implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}
